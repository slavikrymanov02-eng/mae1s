<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MATES</title>

<style>

body
{
    margin: 0;

    background: #171a21;

    font-family: Segoe UI;

    color: white;
}

.topbar
{
    height: 70px;

    background: #10141b;

    border-bottom:
    1px solid #2a475e;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
    0 40px;
}

.logo
{
    font-size: 30px;

    font-weight: bold;
}

.nav
{
    display: flex;

    gap: 30px;
}

.nav a
{
    color: #c7d5e0;

    text-decoration: none;

    font-size: 17px;
}

.hero
{
    height: 650px;

    background:
    linear-gradient(
    rgba(0,0,0,0.4),
    rgba(0,0,0,0.8)
    ),
    url("images/bg.jpg");

    background-size: cover;

    background-position: center;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding-left: 100px;
}

.hero h1
{
    font-size: 70px;

    margin: 0;
}

.hero p
{
    width: 700px;

    font-size: 22px;

    color: #c7d5e0;

    line-height: 1.6;
}

.download-btn
{
    width: 320px;

    height: 65px;

    background: #66c0f4;

    border: none;

    color: white;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 35px;

    border-radius: 4px;

    transition: 0.2s;
}

.download-btn:hover
{
    background: #4fa7d8;
}

.games
{
    padding:
    70px
    100px;
}

.games h2
{
    font-size: 40px;
}

.grid
{
    display: grid;

    grid-template-columns:
    repeat(3, 1fr);

    gap: 30px;
}

.card
{
    background: #1b2838;

    border-radius: 8px;

    overflow: hidden;

    transition: 0.2s;
}

.card:hover
{
    transform: scale(1.02);
}

.card img
{
    width: 100%;

    height: 220px;

    object-fit: cover;
}

.card-content
{
    padding: 20px;
}

.card h3
{
    margin-top: 0;

    font-size: 24px;
}

.card p
{
    color: #c7d5e0;
}

.footer
{
    margin-top: 80px;

    border-top:
    1px solid #2a475e;

    padding: 30px;

    text-align: center;

    color: gray;
}

</style>
</head>
<body>

<div class="topbar">

    <div class="logo">
        MATES
    </div>

    <div class="nav">

        <a href="#">
            Магазин
        </a>

        <a href="#">
            Библиотека
        </a>

        <a href="#">
            Сообщество
        </a>

        <a href="#">
            Поддержка
        </a>

    </div>

</div>

<div class="hero">

    <h1>
        MATES CLIENT
    </h1>

    <p>
        Современная игровая платформа
        для общения, библиотеки игр
        и цифрового контента.
    </p>

    <a href="MatesSetup.exe" download>

        <button class="download-btn">
            СКАЧАТЬ CLIENT
        </button>

    </a>

</div>

<div class="games">

    <h2>
        Популярное
    </h2>

    <div class="grid">

        <div class="card">

            <img src="images/game1.jpg">

            <div class="card-content">

                <h3>
                    Kayf Life 3
                </h3>

                <p>
                    Экшен / Приключение
                </p>

            </div>

        </div>

        <div class="card">

            <img src="images/game2.jpg">

            <div class="card-content">

                <h3>
                    Portal Stories
                </h3>

                <p>
                    Головоломка / Sci-Fi
                </p>

            </div>

        </div>

        <div class="card">

            <img src="images/game3.jpg">

            <div class="card-content">

                <h3>
                    Black Mesa
                </h3>

                <p>
                    Шутер / Научная фантастика
                </p>

            </div>

        </div>

    </div>

</div>

<div class="footer">
    MATES © 2026
</div>

</body>
</html>
